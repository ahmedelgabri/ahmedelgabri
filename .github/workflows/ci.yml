name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: vx.x.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint && deno doc --lint mod.ts cli.ts

      - name: Type-check
        run: deno check ./scripts/*.ts ./*.ts tests/contract.js

      - name: Test source
        run: deno task test

  runtimes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: vx.x.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Test built artifact in Deno, Node.js, and Bun
        run: deno task test:artifact

      - name: Test built artifact in workerd
        run: deno task test:workerd

      - name: Validate package
        run: deno task check:package

      - name: Report bundle size
        run: deno task gzip
