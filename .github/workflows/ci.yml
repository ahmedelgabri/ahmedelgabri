name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: vx.x.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint && deno doc --lint mod.ts cli.ts

      - name: Type-check
        run: deno check ./scripts/*.ts ./*.ts tests/contract.js

      - name: Test source
        run: deno task test

  runtimes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: vx.x.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Build and test artifact in all runtimes
        run: deno task test:runtimes

      - name: Validate package
        run: deno task check:package

      - name: Report bundle size
        run: deno task gzip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, runtimes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
